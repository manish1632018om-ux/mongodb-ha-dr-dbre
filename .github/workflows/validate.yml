name: MongoDB HA DR Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Bash scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Start and initialize MongoDB replica set
        run: ./scripts/init-replica-set.sh

      - name: Wait for healthy replica set
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T mongo1 mongosh --quiet --eval '
              const members = rs.status().members;
              const primary = members.filter(m => m.stateStr === "PRIMARY");
              const secondaries = members.filter(m => m.stateStr === "SECONDARY");
              if (primary.length !== 1 || secondaries.length !== 2) quit(1);
            '; then
              echo "Replica set healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Replica set did not become healthy"
          exit 1

      - name: Test majority write and replication
        run: |
          PRIMARY=""

          for i in $(seq 1 30); do
            for SERVICE in mongo1 mongo2 mongo3; do
              if docker compose exec -T "$SERVICE" mongosh --quiet --eval '
                if (!db.hello().isWritablePrimary) quit(1);
              ' >/dev/null 2>&1; then
                PRIMARY="$SERVICE"
                break
              fi
            done

            if [[ -n "$PRIMARY" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$PRIMARY" ]]; then
            echo "ERROR: No writable primary found"
            exit 1
          fi

          echo "Detected primary: $PRIMARY"

          docker compose exec -T "$PRIMARY" mongosh --quiet --eval '
            const d = db.getSiblingDB("ci_test");
            const result = d.transactions.insertOne(
              {transaction_id:"CI1001",status:"SUCCESS"},
              {writeConcern:{w:"majority",wtimeout:10000}}
            );
            if (!result.acknowledged) quit(1);
            print("Majority write: PASS");
          '

          for i in $(seq 1 30); do
            for SERVICE in mongo1 mongo2 mongo3; do
              if [[ "$SERVICE" == "$PRIMARY" ]]; then
                continue
              fi

              if docker compose exec -T "$SERVICE" mongosh --quiet --eval '
                db.getMongo().setReadPref("secondary");
                const d = db.getSiblingDB("ci_test");
                const txn = d.transactions.findOne({transaction_id:"CI1001"});
                if (!txn || txn.status !== "SUCCESS") quit(1);
                print("Secondary replication: PASS");
              '; then
                exit 0
              fi
            done

            sleep 2
          done

          echo "Secondary replication verification failed"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Clean up
        if: always()
        run: docker compose down -v
